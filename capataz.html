  /* Los que trabajan ahora y los que piden una persona **ya se dibujaron
     arriba**, en su zona. Acá queda el resto: los que trabajaron hace rato y
     los que se cerraron. */
  var conZona = zonas(filas);
  filas = conZona.resto;
  if (!filas.length) {
    /* **Cero acá no siempre es cero.** Si los que hay están todos arriba,
       decir «ningún agente de Claude Code en esta máquina» sería mentir justo
       cuando el tablero está lleno — la regla 3 por la vía de una lista vacía.
       Son dos frases distintas porque son dos hechos distintos. */
    cont.innerHTML = h + '<div class="nada">' +
      (conZona.pide.length || conZona.vivos.length
        ? 'ningún otro: todos los agentes de esta máquina están arriba, ' +
          'trabajando ahora'
        : 'ningún agente de Claude Code en esta máquina. Los de otra máquina ' +
          'no se ven acá: eso lo contesta GitHub') + '</div>';
    return;
  }
  for (var i = 0; i < filas.length; i++) {
    var s = filas[i];
    /* El latido va **al lado del nombre**: no es un estado, es «se está
       moviendo ahora». El umbral lo manda el servidor, como los otros dos. */
    var late = D && D.umbrales_taller && s.quieto_hace !== null &&
      s.quieto_hace !== undefined &&
      haceVivo(s.quieto_hace) < D.umbrales_taller.latiendo;
    /* El color del borde izquierdo, que es lo que separa un agente del de
       abajo de un vistazo. El orden es por **qué hay que hacer**: primero el
       que pide una persona, después el que se está moviendo. */
    var color = s.estado_consola === "falló" ? "f-rojo"
      : s.estado_consola === "esperando" ? "f-ambar"
      : late ? "f-verde"
      : s.viva === true ? "f-tenue" : "f-apagado";

    h += '<div class="fila ' + color + '">' +
      '<div class="cab">' +
      (late ? '<span class="late" title="escribiendo ahora"></span>' : '') +
      '<b class="quien">' + esc(s.quien || s.nombre || s.sesion) + '</b>' +
      /* Las dos etiquetas que se leen primero: de qué proyecto es y qué rol
         tiene. «sin rol» se dibuja como «no sé» y no se esconde: quiere decir
         que en ese proyecto los agentes no firman con su rol. */
      '<span class="tag' + (s.proyecto ? '' : ' nose') + '">' +
      esc(s.proyecto || "sin proyecto") + '</span>' +
      '<span class="tag' + (s.rol ? ' tag-rol' : ' nose') + '">' +
      esc(s.rol || "sin rol") + '</span>' +
      '</div>';

    /* Qué está haciendo, en un renglón. Es lo segundo que se lee. */
    if (s.que) {
      h += '<div class="hace"><b>' + esc(s.que) + '</b>' +
        (s.sobre ? '<span>' + esc(s.sobre) + '</span>' : '') +
        (s.quieto_hace === null || s.quieto_hace === undefined ? '' :
          '<i>' + esc(hace(s.quieto_hace)) + '</i>') + '</div>';
    }

    /* El contexto, en un renglón tenue: rama, punto, estado y dónde. Lo que
       antes ocupaba cinco renglones de chips. */
    var ctx = [];
    if (s.viva === true) ctx.push("prendida");
    else if (s.viva === false) ctx.push("el proceso no está");
    else if (s.fuente !== "github") ctx.push("no sé si vive");
    if (s.estado_consola) ctx.push(s.estado_consola);
    if (s.github) ctx.push(s.github.estado);
    if (s.rama || (s.github && s.github.que)) ctx.push(s.rama || s.github.que);
    if (s.github && s.github.punto) ctx.push(s.github.punto);
    if (s.cwd) ctx.push(corto(s.cwd));
    h += '<div class="ctx">' + esc(ctx.join(" · ")) + '</div>';

    /* Y abajo, **sólo lo que es un problema**. Antes acá bajaban tres párrafos
       en cada tarjeta —incluido «sin subagentes todavía», que sale en todas— y
       eso es el aviso que enseña a ignorarse. Ahora se muestra el motivo del
       estado sólo cuando dice algo que el renglón de arriba no dice. */
    /* El motivo baja **sólo cuando dice algo que el renglón no dice**: que el
       CLI lo da por vivo y no queda archivo suyo (T37), o la palabra cruda de
       un estado que capataz no entiende. «terminado · terminó solo» no agrega
       nada y no baja. Antes la condición era «viene del CLI», que es de dónde
       sale el dato y no qué dice — y desde que un background con archivo puede
       estar trabado, esa condición escondía justo el motivo que importa. */
    if (s.motivo_consola && (s.fantasma || s.estado_consola === "no sé")) {
      h += '<div class="porque">' + esc(s.motivo_consola) + '</div>';
    }
    if (!s.que && s.motivo_que) {
      h += '<div class="porque">' + esc(s.motivo_que) + '</div>';
    }
    if (s.id) h += '<div class="attach">claude attach ' + esc(s.id) + '</div>';
    for (var j = 0; j < (s.agentes || []).length; j++) {
      h += filaSubagente(s.agentes[j]);
    }
    h += '</div>';
  }
  cont.innerHTML = h;
}

/* ---------------------------------------------------------------------------
   La consola: los agentes background, y el único dato que nadie más tiene.

   Las otras dos secciones salen de git y de archivos. Ésta sale de correr
   `claude agents --json --all`, y existe por una razón medida: el `state` de un
   background no está en ningún archivo, y el de uno que **ya terminó** no está
   en ninguna parte más —al pararse, su `<pid>.json` se borra—.

   El estado NO se recalcula acá, al revés que el de las ramas y el del taller.
   Aquéllos son un reloj —«hace cuánto que no se mueve»— y la pantalla los
   vuelve a decidir cada segundo para no quedarse con una foto vieja. Éste es un
   hecho que el CLI afirma, no un umbral: recalcularlo sería inventarlo.
--------------------------------------------------------------------------- */
var CLASE_CONSOLA = {
  "trabajando": "c-trabajando", "esperando": "c-esperando", "falló": "c-fallo",
  "terminado": "c-quieto", "parado": "c-quieto", "en cola": "c-quieto",
  "no sé": "nose"
};


/* ---------------------------------------------------------------------------
   El menú, y la marca que hace que una pestaña no esconda nada.

   Las cuatro vistas se declaran en UN lugar: el lateral y la tabbar se dibujan
   de acá, así que agregar una quinta no es tocar el marcado en tres lados.

   `problemasDe` es la mitad que justifica el cambio. Apiladas, las secciones se
   veían al pasar; detrás de un menú, un «no pude leer» que nadie abre es un
   error que no existe. Entonces la pestaña se marca **aunque esté escondida**.

   Y marca dos cosas nada más: **lo que no se pudo leer** y **lo que pide una
   persona**. Los estados normales no: medido el 2026-08-15, los cuatro agentes
   de este tablero están `caído` y los tres proyectos tienen filas «sin estado»,
   así que marcar por eso sería prender las cuatro pestañas en todas las
   corridas — el aviso que enseña a ignorarse, corolario de la regla 3.
--------------------------------------------------------------------------- */
/* Tres, y los nombres dicen **de dónde sale cada una**, que es la distinción
   que costó entender cuando eran cuatro: el taller es esta máquina ahora mismo,
   GitHub es lo que quedó publicado, y los proyectos contestan cómo va cada uno. */
var VISTAS = [
  { clave: "agentes",   rotulo: "Agentes",   icono: "◈" },
  { clave: "proyectos", rotulo: "Proyectos", icono: "▦" }
];
/* La consola primero, y es una decisión: es lo único de la pantalla que puede
   pedir que alguien haga algo ahora mismo.

   **Quién decide de verdad con cuál se abre es `arrancarVistas()`**, abajo;
   esto es el valor con el que se dibuja el menú antes de que ésa corra. Vale
   escribirlo porque poner un bug acá **no pone nada rojo** —lo pisa el arranque
   en el mismo tick— y eso se confundió una vez con una aserción vacua. */
var VISTA = VISTAS[0].clave;

function problemasDe(d, clave) {
  if (!d) return 0;
  if (clave === "agentes") {
    /* La pestaña de agentes cubre ahora las **tres** fuentes, porque la vista
       las unió. Marca si alguna no se pudo leer, si hay un agente trabado, y si
       hay un `sin rama` —un `en curso (fulano)` del que no llegó ni un commit—.
       No marcan los estados normales: un background `terminado` es un hecho, y
       `caído` es el estado más común de este tablero. */
    var n = 0;
    if (d.taller && !d.taller.ok) n += 1;
    if (d.consola && !d.consola.ok) n += 1;
    var filas = (d.agentes_todos && d.agentes_todos.length)
      ? d.agentes_todos
      : ((d.taller && d.taller.agentes_maquina) || []);
    for (var i = 0; i < filas.length; i++) {
      var f = filas[i];
      if (f.estado_consola === "esperando" || f.estado_consola === "falló") n += 1;
      if (f.github && f.github.estado === "sin rama") n += 1;
    }
    return n;
  }
  if (clave === "proyectos") {
    return (d.proyectos || []).filter(function (p) {
      var s = p.seguimiento || {};
      return s.existe === false || !!s.error;
    }).length;
  }
  return 0;
}

function irA(clave) {
  VISTA = clave;
  var vistas = document.querySelectorAll(".vista");
  for (var i = 0; i < vistas.length; i++) {
    var v = vistas[i];
    if (v.getAttribute("data-vista") === clave) v.removeAttribute("hidden");
    else v.setAttribute("hidden", "");
  }
  /* Cambiar de pestaña **no vuelve a pedir nada**: se dibuja de `D`, la misma
     foto que ya está. Un menú que dispara una lectura por toque es un menú que
     hace parpadear el tablero. */
  pintarNav();
  try { if (window.location) window.location.hash = clave; } catch (e) { }
}

function botonVista(v) {
  var n = problemasDe(D, v.clave);
  return '<button type="button" data-vista="' + v.clave + '"' +
    (v.clave === VISTA ? ' aria-current="page"' : '') +
    ' aria-label="' + esc(v.rotulo) + '">' +
    '<span class="icono" aria-hidden="true">' + v.icono + '</span>' +
    '<span class="rotulo">' + esc(v.rotulo) + '</span>' +
    (n ? '<span class="marca-vista" title="' + n + ' para mirar acá"></span>' : '') +
    '</button>';
}

function pintarNav() {
  var h = "";
  for (var j = 0; j < VISTAS.length; j++) h += botonVista(VISTAS[j]);
  var lugares = ["nav-principal", "tabbar"];
  for (var i = 0; i < lugares.length; i++) {
    var cont = document.getElementById(lugares[i]);
    if (!cont) continue;
    cont.innerHTML = h;
    /* El manejador se cuelga después de escribir el HTML, que es como dibuja
       todo el resto de este archivo. */
    var botones = cont.querySelectorAll("button");
    for (var k = 0; k < botones.length; k++) {
      botones[k].onclick = (function (clave) {
        return function () { irA(clave); };
      })(botones[k].getAttribute("data-vista"));
    }
  }
}

/* ---------------------------------------------------------------------------
   Apariencia: claro, oscuro, o lo que diga el aparato.

   El tema **no se guarda en el servidor**, y no es un detalle: capataz no
   guarda estado propio (regla 1). La preferencia es de quien mira, así que vive
   en su navegador. Si no hay `localStorage` —una instantánea abierta con
   `file://`, un navegador con todo apagado— no se rompe nada: se queda en
   automático, que es el que no necesita memoria.
--------------------------------------------------------------------------- */
var TEMAS = [
  { clave: "auto", rotulo: "Automático", ayuda: "lo que diga el aparato" },
  { clave: "claro", rotulo: "Claro" },
  { clave: "oscuro", rotulo: "Oscuro" }
];
var TEMA = "auto";

function leerTema() {
  try {
    var v = window.localStorage && window.localStorage.getItem("capataz-tema");
    for (var i = 0; i < TEMAS.length; i++) if (TEMAS[i].clave === v) return v;
  } catch (e) { /* sin localStorage se sigue igual */ }
  return "auto";
}

function temaEfectivo(clave) {
  if (clave !== "auto") return clave;
  /* Sin `matchMedia` se asume oscuro, que es el tema con el que nació esta
     pantalla: adivinar claro pintaría de blanco a quien no pidió nada. */
  try {
    if (window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: light)").matches) return "claro";
  } catch (e) { /* nada */ }
  return "oscuro";
}

function aplicarTema(clave) {
  TEMA = clave;
  var raiz = document.documentElement;
  if (raiz) {
    if (temaEfectivo(clave) === "claro") raiz.setAttribute("data-tema", "claro");
    else raiz.removeAttribute("data-tema");
  }
  try {
    if (window.localStorage) window.localStorage.setItem("capataz-tema", clave);
  } catch (e) { /* nada */ }
  pintarApariencia();
}

function pintarApariencia() {
  var m = document.getElementById("menu-apariencia");
  if (!m) return;
  var h = "";
  for (var i = 0; i < TEMAS.length; i++) {
    var t = TEMAS[i];
    h += '<button type="button" data-tema="' + t.clave + '"' +
      (t.clave === TEMA ? ' aria-current="true"' : '') + '>' + esc(t.rotulo) +
      '</button>' +
      (t.ayuda ? '<div class="ayuda">' + esc(t.ayuda) + '</div>' : '');
  }
  m.innerHTML = h;
  var botones = m.querySelectorAll("button");
  for (var k = 0; k < botones.length; k++) {
    botones[k].onclick = (function (clave) {
      return function () { aplicarTema(clave); m.setAttribute("hidden", ""); };
    })(botones[k].getAttribute("data-tema"));
  }
}

function arrancarApariencia() {
  aplicarTema(leerTema());
  var b = document.getElementById("btn-apariencia");
  var m = document.getElementById("menu-apariencia");
  if (b && m) {
    b.onclick = function () {
      if (m.hasAttribute("hidden")) m.removeAttribute("hidden");
      else m.setAttribute("hidden", "");
    };
  }
}

function pintar(d) {
  D = d;
  T_RECIBIDO = Date.now();
  document.getElementById("cabecera").textContent =
    d.cuando + " · " + d.proyectos.length + " proyecto" +
    (d.proyectos.length === 1 ? "" : "s") + " vigilado" +
    (d.proyectos.length === 1 ? "" : "s") + " en GitHub";

  marcarDespiertos(d.agentes || []);
  /* Sólo se vuelve a dibujar si algo cambió de verdad. Repintar cada dos
     segundos lo mismo apaga el latido del que se despertó y hace parpadear una
     pantalla que se mira fija. */
  var firma = JSON.stringify(d.agentes) + "|" + JSON.stringify(DESPIERTOS);
  if (firma !== FIRMA) { FIRMA = firma; pintarAgentes(); }

  /* Con la misma disciplina: se repinta sólo si cambió. Un subagente que
     escribe cada dos segundos cambiaría el mtime todo el tiempo, así que la
     firma ignora el reloj y mira quién está y en qué estado. */
  /* `que` y `sobre` van adentro de la firma, y eso costó un bug: sin ellos, una
     sesión que pasa de `Bash` a `Edit` **no se repinta nunca** —quién está y en
     qué estado no cambió—, así que la pantalla en vivo mostraba lo que el
     agente hacía hace media hora. Se vio mirando el navegador: forzar
     `pintarTaller()` a mano lo dibujaba bien. Sigue sin mirar el reloj: el
     `mtime` cambia cada dos segundos y eso haría parpadear la sección entera. */
  /* Una sola firma, porque ahora es una sola sección. Mira la lista **ya
     unida** —que es la que se dibuja—, más el estado de la consola y los
     desacuerdos, que también se pintan ahí. Sigue sin mirar el reloj: el
     `mtime` cambia cada dos segundos y eso haría parpadear la sección entera. */
  /* Las dos zonas de arriba se pintan **siempre**, sin firma que las cuide:
     `pintarVivos` compara nodo por nodo y sólo escribe lo que cambió, así que
     llamarla de más no cuesta nada y llamarla de menos deja el reloj viejo.
     La firma es para lo que se redibuja entero, que es lo de abajo. */
  var z = zonas(((d && d.agentes_todos) || []));
  pintarPide(z.pide);
  pintarVivos(z.vivos);
  var tv = document.getElementById("titulo-vivos");
  if (tv) {
    tv.textContent = z.vivos.length
      ? "Trabajando ahora · " + z.vivos.length
      : "Trabajando ahora";
  }

  var firmaT = JSON.stringify(
    ((d.taller && (d.taller.agentes_maquina || d.taller.sesiones)) || []).map(
      function (s) {
        return [s.sesion, s.viva, s.proyecto, s.que, s.sobre, s.estado_consola,
          s.fuente, (s.agentes || []).map(function f(a) {
            return [a.id, a.estado, a.que, a.sobre, (a.hijos || []).map(f)];
          })];
      })) + "|" +
    ((d.taller && d.taller.ok) ? "ok" : (d.taller && d.taller.error)) + "|" +
    ((d.consola && d.consola.ok) ? "ok" : (d.consola && d.consola.error)) + "|" +
    JSON.stringify((d.consola && d.consola.desacuerdos) || []);
  if (firmaT !== FIRMA_TALLER) { FIRMA_TALLER = firmaT; pintarTaller(); }

  var h = "";
  if (d.sin_proyectos) {
    h = '<div class="tarjeta"><h2>Ningún proyecto vigilado</h2>' +
        '<div class="tenue">Agregá uno en <code>proyectos.json</code>: el ' +
        '<code>owner/repo</code> de GitHub y el nombre de su archivo de ' +
        'seguimiento, porque no todos se llaman igual.</div></div>';
  }
  for (var i = 0; i < d.proyectos.length; i++) h += tarjeta(d.proyectos[i]);
  document.getElementById("cuerpo").innerHTML = h;

  /* El menú se repinta con cada dato, porque las marcas salen del dato: una
     consola que se cayó recién tiene que prender su pestaña sin que nadie
     navegue hasta ahí. */
  pintarNav();
}

function traer() {
  fetch("/api/estado", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) { ULTIMO_OK = Date.now(); pintar(d); })
    .catch(function (e) {
      /* No se toca lo que ya está dibujado: de eso se encarga `pintarFrescura`,
         que es quien sabe hace cuánto que no se sabe nada. */
      document.getElementById("cabecera").textContent =
        "no llego al servidor: " + e;
    });
}

function tick() {
  tickRelojes();
  /* Los de arriba se refrescan por adentro: se les toca el texto del reloj y,
     si cruzaron un umbral, la clase de la caja. Ni una línea de HTML. */
  refrescarVivos();
  pintarFrescura();
}

/* La vista con la que se abre. Por defecto la consola —lo que se pidió—, y si
   la dirección trae un `#taller` se respeta: recargar en el teléfono no tiene
   por qué devolverte al principio. */
function arrancarVistas() {
  var pedida = "";
  try {
    pedida = ((window.location && window.location.hash) || "").replace("#", "");
  } catch (e) { pedida = ""; }
  var vale = false;
  for (var i = 0; i < VISTAS.length; i++) if (VISTAS[i].clave === pedida) vale = true;
  irA(vale ? pedida : VISTAS[0].clave);
}

/* La apariencia se aplica **antes** que cualquier dato: si esperara al primer
   fetch, quien eligió claro vería un destello oscuro en cada carga. */
arrancarApariencia();

if (window.CAPATAZ_DATOS) {
  /* Instantánea estática: los datos vienen incrustados y no hay a quién
     preguntarle. Es lo que se abre con `file://` para mirar el ancho angosto.
     Los contadores igual avanzan —el tiempo pasa— pero la pantalla dice que es
     una foto, porque nadie la está refrescando. */
  ESTATICA = true;
  pintar(window.CAPATAZ_DATOS);
  arrancarVistas();
  setInterval(tick, 1000);
  tick();
} else {
  arrancarVistas();
  traer();
  setInterval(traer, 2000);
  setInterval(tick, 1000);
}
</script>
</body>
</html>
