<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- El requisito que motiva el proyecto: esto se lee desde un teléfono. Sin
     este meta, un móvil dibuja a 980 px y después achica: todo entra y nada se
     lee. `pruebas/verificar-angosto.py` § 1 se pone rojo si desaparece. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>capataz</title>
<style>
/* ---------------------------------------------------------------------------
   La paleta, en tokens — y el tema claro

   Hasta el 2026-08-15 los 49 colores estaban escritos a mano adentro de cada
   regla, así que un tema claro era imposible sin tocar 49 lugares. Ahora cada
   uno es un token, y el nombre sale de **para qué se usa**: `fondo`, `borde` o
   `texto`, numerados por luminancia. No es decoración: es lo que permite que la
   regla 3 —«no sé» nunca verde— se pueda verificar en los dos temas.

   El claro **no se eligió color por color**: se genera dando vuelta la
   luminosidad y conservando el tono, con dos excepciones escritas. Los acentos
   —verde, ámbar, rojo, rosa— mantienen su tono y bajan a una luminosidad que se
   lee sobre blanco: un verde de fondo oscuro puesto tal cual sobre papel es
   invisible, y ahí el chip de estado dejaría de decir lo que dice.

   Y el tema **no se guarda en el servidor**: capataz no guarda estado propio
   (regla 1). Vive en el navegador de quien mira, que es de quien es la
   preferencia.
--------------------------------------------------------------------------- */
:root {
  /* Estas dos NO salen de dar vuelta la luminosidad, y por eso están escritas
     a mano en los dos temas: son las únicas dos cosas de la pantalla que
     existen **para llamar la atención** —el latido de quien está trabajando
     ahora, y la marca de la pestaña que tiene algo—. La inversión automática
     les bajaba la saturación justo a ellas y sobre papel quedaban invisibles;
     se vio mirando, no en un arnés. */
  --latido: #2f9e6b;
  --marca: #e0a340;
  --fondo-1: #12141a;
  --fondo-2: #161922;
  --fondo-3: #2a1212;
  --fondo-4: #2b1220;
  --fondo-5: #12251a;
  --fondo-6: #1b1e27;
  --fondo-7: #12232b;
  --fondo-8: #2e1a10;
  --fondo-9: #1a1f2b;
  --fondo-10: #122b22;
  --fondo-11: #2a2212;
  --fondo-12: #2b2512;
  --fondo-13: #1f2532;
  --fondo-14: #232837;
  --fondo-15: #14352a;
  --fondo-16: #262c3b;
  --fondo-17: #b03434;
  --fondo-18: #e0a340;
  --borde-1: #262b38;
  --borde-2: #2a2f3d;
  --borde-3: #2f3648;
  --borde-4: #6b1e4a;
  --borde-5: #7a2020;
  --borde-6: #33405c;
  --borde-7: #3a3f52;
  --borde-8: #1e4f6b;
  --borde-9: #245c34;
  --borde-10: #7a3b1a;
  --borde-11: #1e6b4f;
  --borde-12: #6b5a1e;
  --borde-13: #7a5a1a;
  --borde-14: #55607a;
  --borde-15: #2f9e6b;
  --borde-16: #b8862a;
  --texto-1: #6b7387;
  --texto-2: #8b93a7;
  --texto-3: #8b94a8;
  --texto-4: #98a2b8;
  --texto-5: #7fb2ff;
  --texto-6: #f0b46a;
  --texto-7: #b9c0d0;
  --texto-8: #cfd5e4;
  --texto-9: #a6f0d2;
  --texto-10: #cfd9ee;
  --texto-11: #ffc9c9;
  --texto-12: #b6f0c6;
  --texto-13: #ffc9e0;
  --texto-14: #f0dca6;
  --texto-15: #e6e8ee;
}
/* El claro. `color-scheme` le avisa al navegador para que las barras de scroll
   y los controles nativos acompañen. */
:root[data-tema="claro"] {
  color-scheme: light;
  --latido: #0f7a4a;
  --marca: #a86a06;
  --fondo-1: #f6f6f7;
  --fondo-2: #f3f4f5;
  --fondo-3: #f4e6e6;
  --fondo-4: #f4e6ee;
  --fondo-5: #e7f3ec;
  --fondo-6: #f1f2f4;
  --fondo-7: #e6f0f4;
  --fondo-8: #f6eae5;
  --fondo-9: #e9ebf2;
  --fondo-10: #e6f4ef;
  --fondo-11: #f4f0e6;
  --fondo-12: #f4f1e6;
  --fondo-13: #e9ecf1;
  --fondo-14: #e9ebf1;
  --fondo-15: #e5f5f0;
  --fondo-16: #ebecee;
  --fondo-17: #f7e3e3;
  --fondo-18: #f7efe3;
  --borde-1: #d1d3d9;
  --borde-2: #cfd1d8;
  --borde-3: #cccfd5;
  --borde-4: #a72f74;
  --borde-5: #aa2d2d;
  --borde-6: #3b599b;
  --borde-7: #c8cad2;
  --borde-8: #2f7ca7;
  --borde-9: #3b9b56;
  --borde-10: #b15526;
  --borde-11: #2fa77c;
  --borde-12: #a78d2f;
  --borde-13: #b18226;
  --borde-14: #bbbfc7;
  --borde-15: #31a570;
  --borde-16: #ae7f28;
  --texto-1: #4b505b;
  --texto-2: #393d46;
  --texto-3: #393d45;
  --texto-4: #31343b;
  --texto-5: #003380;
  --texto-6: #95590f;
  --texto-7: #212328;
  --texto-8: #151e36;
  --texto-9: #0f593b;
  --texto-10: #111b30;
  --texto-11: #360000;
  --texto-12: #0f491f;
  --texto-13: #360017;
  --texto-14: #59450f;
  --texto-15: #1f2126;
}

/* ---------------------------------------------------------------------------
   Angosto primero, y sin excepciones.

   La medida de referencia es 360 px: lo importante tiene que entrar SIN scroll
   horizontal y SIN zoom. Las tres reglas que lo garantizan y que el arnés
   vigila una por una:

     1. ningún ancho fijo mayor a 360 px en toda la hoja;
     2. `overflow-wrap: anywhere` en todo lo que lleve texto de otro proyecto
        —los títulos de los puntos traen rutas y `código` sin espacios, que es
        exactamente lo que desborda—;
     3. ni un `<table>`: una tabla de cinco columnas no entra en 360 px de
        ninguna forma. Todo son filas apiladas que envuelven.
--------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
body {
  background: var(--fondo-1); color: var(--texto-15);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  /* Sin padding lateral: lo pone `.app`. La barra tiene que llegar de borde a
     borde, y sacarla del padding con un margen negativo dejaba el primer título
     seis píxeles **debajo** de ella con la página sin scrollear — medido en el
     navegador, no supuesto. */
  padding: 0 0 40px; overflow-wrap: anywhere; word-break: break-word;
}
/* Espacio para la tabbar fija: sin esto, el último renglón de cualquier vista
   queda debajo del menú y no se puede leer. Se vio mirando el teléfono. */
@media (max-width: 699px) {
  body { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
}
.hoja { max-width: 340px; margin: 0 auto; }
@media (min-width: 700px) { .hoja { max-width: 640px; } }

/* ---------------------------------------------------------------------------
   El shell: barra arriba, menú al costado en pantalla ancha, tabbar abajo en
   teléfono. La forma está copiada del shell de ERP 360 (`static/index.html`) a
   propósito: son dos tableros del mismo sistema y aprender a moverse en uno
   tiene que servir para el otro.

   **Lo que NO se movió a una pestaña: la frescura y el pulso.** Viven en la
   barra, visibles desde cualquier vista. Adentro de una, las otras tres
   quedarían mostrando datos sin decir de cuándo son — que es la regla 3 rota
   justo en el dato que dice si creerle al resto de la pantalla.
--------------------------------------------------------------------------- */
.shell { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
         gap: 8px; padding: 8px 10px; background: var(--fondo-2);
         border-bottom: 1px solid var(--borde-1); }
.app { padding: 10px 10px 0; }
/* `white-space: nowrap` y `flex: 0 0 auto`: sin los dos, el estado —que es
   texto largo— le come el ancho a la marca y «capataz» sale partido en dos
   renglones, «cap a / ta z». Se vio mirando el teléfono, no en el arnés: para
   él es una cadena que está entera. La hoja de estilo es de los dos lados y el
   que decide quién cede el ancho es el contenedor. */
.shell .marca { font: 600 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
                letter-spacing: .5px; white-space: nowrap; flex: 0 0 auto; }
.shell .marca b { color: var(--texto-5); font-weight: 700; }
/* El que cede es el estado, y cede **cortando el renglón de abajo**: la hora y
   la cuenta de proyectos son lo prescindible. La frescura de arriba no se
   corta nunca — es la que dice si creerle al resto de la pantalla. */
.shell-estado { margin-left: auto; text-align: right; font-size: 10px;
                color: var(--texto-2); line-height: 1.25; min-width: 0; flex: 1 1 auto; }
.shell-estado .cuando { display: block; color: var(--texto-1);
                        white-space: nowrap; overflow: hidden;
                        text-overflow: ellipsis; }

.app { display: block; }
@media (min-width: 700px) {
  .app { display: flex; gap: 14px; align-items: flex-start; max-width: 900px;
         margin: 0 auto; }
  .lateral { position: sticky; top: 52px; width: 190px; flex: 0 0 190px;
             padding-top: 12px; }
  .contenido { flex: 1 1 auto; min-width: 0; }
  .tabbar-envoltorio { display: none; }
}
@media (max-width: 699px) { .lateral { display: none; } }

/* El menú se dibuja de `VISTAS`, en un solo lugar: una vista nueva aparece en
   el lateral y en la tabbar sin tocar el marcado. */
nav.principal { display: flex; flex-direction: column; gap: 2px; }
nav.principal button { display: flex; align-items: center; gap: 8px; width: 100%;
  text-align: left; background: transparent; border: 1px solid transparent;
  color: var(--texto-7); font: 500 13px/1.2 inherit; padding: 9px 10px;
  border-radius: 8px; cursor: pointer; }
nav.principal button:hover { background: var(--fondo-6); }
nav.principal button[aria-current="page"] { background: var(--fondo-13); color: var(--texto-15);
  border-color: var(--borde-6); }

.tabbar-envoltorio { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--fondo-2); border-top: 1px solid var(--borde-1);
  padding-bottom: env(safe-area-inset-bottom); }
.tabbar { display: flex; }
.tabbar button { flex: 1 1 0; min-width: 0; background: transparent; border: 0;
  color: var(--texto-2); font: 500 10px/1.15 inherit; padding: 7px 2px 8px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center;
  gap: 3px; border-top: 2px solid transparent; }
.tabbar button[aria-current="page"] { color: var(--texto-10); border-top-color: var(--texto-5); }
.tabbar .icono, nav.principal .icono { font-size: 15px; line-height: 1; }
.tabbar .rotulo { max-width: 100%; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }

/* La marca de una pestaña que tiene algo. **Es la mitad del cambio.**
   Apiladas, las cuatro secciones se veían al pasar; con pestañas, un «no pude
   leer» que vive detrás de un menú es un error que nadie ve — o sea que
   navegar por pestañas haría a capataz MENOS honesto que la página vertical.
   Por eso una vista escondida marca su pestaña.

   Y marca sólo dos cosas: **lo que no se pudo leer** y **lo que pide una
   persona**. No los estados normales: «sin estado» y «CI · no sé» salen en
   todas las corridas, y el corolario de la regla 3 dice que un aviso que sale
   siempre enseña a ignorarse. → `pruebas/verificar-pantalla.js` § 10 */
.marca-vista { display: inline-block; min-width: 7px; height: 7px;
               border-radius: 99px; background: var(--marca); margin-left: auto; }
.tabbar .marca-vista { position: absolute; transform: translate(14px, -3px);
                       margin: 0; }
.tabbar button { position: relative; }

/* Sólo una vista a la vez. `hidden` a secas no alcanza: `display:flex` de
   algunos hijos lo pisa. */
.vista[hidden] { display: none !important; }

/* El menú de apariencia. Va en la barra y no adentro de una vista: es del
   aparato de quien mira, no de una sección. */
.icono-shell { background: transparent; border: 1px solid var(--borde-6);
  color: var(--texto-8); border-radius: 8px; font-size: 13px; line-height: 1;
  padding: 6px 8px; cursor: pointer; flex: 0 0 auto; }
.menu-apariencia { position: absolute; right: 8px; top: 46px; z-index: 40;
  background: var(--fondo-2); border: 1px solid var(--borde-6);
  border-radius: 10px; padding: 4px; min-width: 150px; }
.menu-apariencia button { display: block; width: 100%; text-align: left;
  background: transparent; border: 0; color: var(--texto-10);
  font: 500 13px/1.2 inherit; padding: 8px 10px; border-radius: 7px;
  cursor: pointer; }
/* Los mismos tokens que la pestaña abierta del lateral: dos menús que
   marcan lo elegido de dos maneras distintas son dos idiomas en una pantalla. */
.menu-apariencia button[aria-current="true"] { background: var(--fondo-13);
  color: var(--texto-15); }
.menu-apariencia .ayuda { font-size: 11px; color: var(--texto-4);
  padding: 2px 10px 6px; }

/* El latido: la sesión que escribió hace menos que `latiendo` —10 s, que es el
   p90 medido— se ve moverse. **No es un estado**: el estado sigue siendo
   `trabajando`, y por eso el punto late al lado y no reemplaza al chip. Si el
   latido decidiera el estado, un agente pensando veinte segundos se vería
   apagado, que es el error que los umbrales medidos evitan.
   `prefers-reduced-motion` lo apaga: es un adorno, y hay gente a la que un
   parpadeo permanente le arruina la pantalla. */
.late { display: inline-block; width: 7px; height: 7px; border-radius: 99px;
        background: var(--latido); margin-right: 6px;
        /* El nombre lleva prefijo porque **ya había un `latido`** en esta
           hoja —el de la fila que se despertó, que anima el fondo— y en CSS
           gana el último: el punto heredaba esa animación y salía pintado del
           color de una tarjeta en vez del suyo. No dio ningún error, sólo un
           color raro. `verificar-angosto.py` § 5 ahora lo vigila. */
        animation: pulso-late 1.1s ease-in-out infinite; }
@keyframes pulso-late {
  0%, 100% { opacity: .25; transform: scale(.75); }
  50%      { opacity: 1;   transform: scale(1.15); }
}
@media (prefers-reduced-motion: reduce) {
  .late { animation: none; opacity: .9; }
}
.vista > h3:first-child { margin-top: 4px; }

h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: .5px; }
h2 { font-size: 16px; margin: 0 0 2px; }
h3 { font-size: 12px; margin: 12px 0 5px; text-transform: uppercase;
     letter-spacing: .8px; color: var(--texto-2); font-weight: 600; }
.tenue { color: var(--texto-2); font-size: 12px; }
.muy-tenue { color: var(--texto-1); font-size: 11px; }

.tarjeta { background: var(--fondo-6); border: 1px solid var(--borde-2); border-radius: 10px;
           padding: 12px; margin: 12px 0; }

/* Los números por estado. Envuelven; nunca hacen una fila más ancha que la
   pantalla. Y van los CINCO, con los ceros: «pendiente 12» no dice nada al
   lado de «pendiente 12 · en curso 0». */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
.chip { display: inline-flex; align-items: baseline; gap: 5px;
        padding: 4px 8px; border-radius: 7px; font-size: 12px;
        background: var(--fondo-14); border: 1px solid var(--borde-3); }
/* `nowrap`: el nombre de una herramienta es una palabra sola y partirla al
   medio —«TaskC / reate»— no la hace más corta, la hace ilegible. Se vio
   mirando el teléfono. */
.chip b { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.cero { opacity: .45; }
.e-pendiente  { border-color: var(--borde-12); background: var(--fondo-12); }
.e-encurso    { border-color: var(--borde-8); background: var(--fondo-7); }
.e-hecho      { border-color: var(--borde-9); background: var(--fondo-5); }
.e-diferido   { border-color: var(--borde-7); }
.e-descartado { border-color: var(--borde-7); }
.e-sinestado  { border-color: var(--borde-4); background: var(--fondo-4); }
.e-pablo      { border-color: var(--borde-10); background: var(--fondo-8); }

/* «No sé» tiene su propia pinta y NO es verde. Regla 3 de CLAUDE.md: un
   tablero que miente en el caso que importa es peor que no tenerlo. */
.nose { border-style: dashed; border-color: var(--borde-14); background: transparent;
        color: var(--texto-4); }
/* El taller. `sin señal` usa la pinta de «no sé» a propósito: terminado y
   colgado no se distinguen desde el disco, así que el chip no puede parecer
   ninguno de los dos. `cerrado` sí es un hecho sabido —el proceso no está—,
   así que es apagado y no punteado. */
.r-sinsenal { border-style: dashed; border-color: var(--borde-14); background: transparent;
              color: var(--texto-4); }
.r-cerrado  { border-color: var(--borde-7); color: var(--texto-4); }

/* La consola: los agentes background. `esperando` es ámbar y no rojo porque no
   está roto —está trabado esperando a una persona—, y es lo único de esta
   sección que pide que alguien haga algo: por eso va primero y por eso es el
   único color que salta. `terminado`, `parado` y `en cola` son hechos sabidos y
   van apagados; `falló` es rojo porque sí es un incendio.

   Y acá **sí** existen «terminado» y «falló», que en el taller no existen. No es
   una inconsistencia: de un subagente no hay marca de cierre en disco (T19), y
   de un background el CLI la da. Dos preguntas parecidas con respuestas
   distintas, y la pantalla dice la que corresponde a cada una. */
.c-esperando  { border-color: var(--borde-13); background: var(--fondo-11); color: var(--texto-14); }
.c-trabajando { border-color: var(--borde-11); background: var(--fondo-10); color: var(--texto-9); }
.c-fallo      { border-color: var(--borde-5); background: var(--fondo-3); color: var(--texto-11); }
.c-quieto     { border-color: var(--borde-7); color: var(--texto-4); }
.attach { font: 600 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
          color: var(--texto-8); background: var(--fondo-16); padding: 3px 6px; border-radius: 5px;
          display: inline-block; margin-top: 4px; }
/* El desacuerdo entre las dos fuentes. **Casi siempre está vacío**, y ése es el
   punto: si saliera en todas las corridas sería el aviso que enseña a
   ignorarse, y el día que diga algo nadie lo lee (corolario de la regla 3). */
.desacuerdo { border: 1px solid var(--borde-4); background: var(--fondo-4); border-radius: 9px;
              padding: 9px 10px; margin: 8px 0; font-size: 12px; }
.desacuerdo b { color: var(--texto-13); }
.desacuerdo .lado { color: var(--texto-8); margin-top: 3px; }
.sesion { border: 1px solid var(--borde-3); border-radius: 9px; padding: 9px 10px;
          margin: 8px 0; background: var(--fondo-9); }
.sesion .cab { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.sesion .cab b { font-size: 15px; }
.subagente { border-left: 2px solid var(--borde-3); margin: 7px 0 0 2px;
             padding: 0 0 0 9px; }
.subagente .que { font-size: 13px; }
/* Suelta y no como descendiente de `.subagente`: la primera versión la escribió
   anidada y el mensaje de una sesión sin subagentes salió en cuerpo grande,
   tapando a las sesiones de abajo. Se vio mirando la pantalla, no el arnés. */
.porque { font-size: 11px; color: var(--texto-3); margin-top: 3px; }
.rojo  { border-color: var(--borde-5); background: var(--fondo-3); color: var(--texto-11); }
.verde { border-color: var(--borde-9); background: var(--fondo-5); color: var(--texto-12); }
.ambar { border-color: var(--borde-13); background: var(--fondo-11); color: var(--texto-14); }

/* Prendido o caído. Los tres colores de un agente, y son tres a propósito:
   «dudoso» es el rato en que capataz no sabe, y pintarlo de cualquiera de los
   otros dos sería afirmar algo. */
.r-trabajando { border-color: var(--borde-11); background: var(--fondo-10); color: var(--texto-9); }
.r-dudoso     { border-color: var(--borde-13); background: var(--fondo-11); color: var(--texto-14); }
.r-caido      { border-color: var(--borde-5); background: var(--fondo-3); color: var(--texto-11); }
.r-integrada  { border-color: var(--borde-7); color: var(--texto-4); }
.r-principal  { border-color: var(--borde-7); color: var(--texto-4); }
.r-sinrama    { border-style: dashed; border-color: var(--borde-14); color: var(--texto-4); }

ul { list-style: none; margin: 0; padding: 0; }
li { padding: 7px 0; border-top: 1px solid var(--borde-1); }
li:first-child { border-top: 0; }
.id { font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--texto-8); background: var(--fondo-16); padding: 3px 6px; border-radius: 5px;
      display: inline-block; margin-right: 6px; }
.titulo { font-size: 13px; }
.meta { font-size: 11px; color: var(--texto-2); margin-top: 3px; }
.viejo .meta { color: var(--texto-6); }
.nada { font-size: 12px; color: var(--texto-1); padding: 6px 0; }

/* ---------------------------------------------------------------------------
   La vista primaria: los agentes, no los proyectos.

   Lo que se mira no es «cómo va el proyecto X» sino **quién está trabajando
   ahora mismo**, y eso no se busca adentro de la tarjeta del proyecto que le
   tocó. Los proyectos siguen abajo: sirven para otra pregunta.
--------------------------------------------------------------------------- */
.agente { background: var(--fondo-6); border: 1px solid var(--borde-2); border-left-width: 4px;
          border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.a-trabajando { border-left-color: var(--borde-15); }
.a-dudoso     { border-left-color: var(--borde-16); }
.a-caido      { border-left-color: var(--fondo-17); }
.a-sinrama    { border-left-color: var(--borde-14); }
.agente .quien { font-size: 16px; font-weight: 600; }
.agente .donde { font-size: 12px; color: var(--texto-2); margin-top: 2px; }

/* El contador que avanza solo. `tabular-nums` para que no baile de ancho a
   cada segundo, que es lo que hace que un número que corre se lea mal. */
.reloj { font-variant-numeric: tabular-nums; }

/* Un agente que se despertó: cambió el sha, no el reloj. Late unos segundos y
   se apaga sola — un resaltado que queda para siempre deja de avisar. */
.desperto { border-color: var(--borde-15); animation: latido 1.1s ease-out 4; }
@keyframes latido { from { background: var(--fondo-15); } to { background: var(--fondo-6); } }
.recien { color: var(--texto-9); font-size: 11px; margin-top: 3px; }

/* El pulso del demonio. Si esto no late, la pantalla está congelada y hay que
   verlo de un vistazo: una pantalla en vivo que se murió y sigue mostrando el
   último dato es la misma mentira de la regla 3. */
.pulso { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--borde-15); margin-right: 6px; vertical-align: middle;
         transition: opacity .45s linear; }
.pulso.apagado { opacity: .15; }
.pulso.muerto  { background: var(--fondo-17); }

/* Datos que ya no se están refrescando: el servidor no contesta. No se ocultan
   —lo último que se supo sigue siendo lo último que se supo— pero no se pueden
   mostrar como si fueran de ahora. */
.sin-contacto .agente { opacity: .55; }

details { margin-top: 6px; }
summary { font-size: 11px; color: var(--texto-2); cursor: pointer; }
details p { font-size: 11px; color: var(--texto-2); margin: 5px 0 0; }
.pie { text-align: center; margin-top: 20px; }
</style>
</head>
<body>

<!-- La barra. Lleva lo que tiene que verse desde CUALQUIER vista: el pulso, la
     frescura y hace cuánto se leyó GitHub. Si eso viviera adentro de una
     pestaña, las otras tres mostrarían datos sin decir de cuándo son. -->
<header class="shell">
  <span class="pulso" id="pulso"></span>
  <span class="marca">capa<b>taz</b></span>
  <div class="shell-estado">
    <span id="frescura">…</span>
    <span class="cuando" id="cabecera">leyendo…</span>
  </div>
  <button type="button" class="icono-shell" id="btn-apariencia"
          aria-label="Apariencia">◐</button>
  <div class="menu-apariencia" id="menu-apariencia" hidden></div>
</header>

<div class="app">
  <aside class="lateral">
    <nav class="principal" id="nav-principal" aria-label="Secciones"></nav>
  </aside>

  <div class="contenido">
    <main class="hoja" id="contenido">
      <!-- Las cuatro vistas. La primera es la consola: es lo que se pidió y es
           también lo único de la pantalla que puede pedir que alguien vaya a
           hacer algo ahora mismo. -->
      <!-- **Una sola pantalla de agentes.** Antes eran tres secciones, una
           por fuente: archivos, CLI y GitHub. Las tres hablaban del mismo
           agente —el que trabaja acá es el que empuja esa rama— y el que
           miraba tenía que asociarlas de memoria. Una pantalla se parte por
           pregunta, y acá la pregunta es una sola: quién está trabajando. -->
      <section class="vista" data-vista="agentes">
        <h3>Agentes</h3>
        <div class="tenue" id="alcance">…</div>
        <div id="taller"></div>
        <div id="agentes"></div>
      </section>

      <section class="vista" data-vista="proyectos" hidden>
        <h3>Los proyectos</h3>
        <div id="cuerpo"></div>
      </section>

      <div class="pie muy-tenue">
        Capataz sólo lee, y lee de GitHub. El SEGUIMIENTO de cada repositorio es
        la verdad; git es el árbitro.
      </div>
    </main>
  </div>
</div>

<nav class="tabbar-envoltorio" aria-label="Secciones">
  <div class="tabbar" id="tabbar"></div>
</nav>
<!--DATOS-INCRUSTADOS-->
<script>
"use strict";
var ESTADOS = ["pendiente", "en curso", "hecho", "diferido", "descartado"];
var CLASE = {
  "pendiente": "e-pendiente", "en curso": "e-encurso", "hecho": "e-hecho",
  "diferido": "e-diferido", "descartado": "e-descartado",
  "sin estado": "e-sinestado"
};
/* Prendido o caído. Es la lectura que motiva la tanda: «al observar
   variaciones en vivo va a poder ver los agentes que se prenden y apagan».
   `dudoso` tiene su propia clase porque NO es ni verde ni rojo: es el rato en
   que un agente pensando y uno caído se parecen, y capataz no elige. */
var CLASE_RAMA = {
  "trabajando": "r-trabajando", "dudoso": "r-dudoso", "caído": "r-caido",
  "integrada": "r-integrada", "principal": "r-principal",
  "sin rama": "r-sinrama", "no sé": "nose"
};

function esc(t) {
  return String(t === null || t === undefined ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function chip(etiqueta, valor, clase) {
  var cero = (valor === 0) ? " cero" : "";
  return '<span class="chip ' + clase + cero + '"><b>' + esc(valor) + '</b>' +
         esc(etiqueta) + '</span>';
}

/* El chip de un dato que no se pudo leer. Nunca verde, nunca cero: un cero se
   lee como «no hay» y esto es «no sé», que es otra cosa. */
function chipNoSe(etiqueta) {
  return '<span class="chip nose">' + esc(etiqueta) + ' · no sé</span>';
}

function antiguedad(dias) {
  if (dias === null || dias === undefined) return "desde cuándo: no sé";
  if (dias === 0) return "desde hoy";
  return "hace " + dias + (dias === 1 ? " día" : " días");
}

/* Hace cuánto se movió algo, en la unidad que se lee de un vistazo. «hace 2 h»
   y «hace 3 min» dicen cosas muy distintas de un agente y los dos tienen que
   caber en una línea de 360 px. */
function hace(seg) {
  if (seg === null || seg === undefined) return "hace cuánto: no sé";
  if (seg < 90) return "hace " + Math.round(seg) + " s";
  if (seg < 5400) return "hace " + Math.round(seg / 60) + " min";
  if (seg < 172800) return "hace " + Math.round(seg / 3600) + " h";
  return "hace " + Math.round(seg / 86400) + " días";
}

function listaPuntos(puntos, umbralViejo) {
  if (!puntos.length) return '<div class="nada">ninguno</div>';
  var h = "<ul>";
  for (var i = 0; i < puntos.length; i++) {
    var p = puntos[i];
    var viejo = (umbralViejo !== undefined && p.dias !== null &&
                 p.dias >= umbralViejo) ? " viejo" : "";
    h += '<li class="' + viejo + '">' +
         '<span class="id">' + esc(p.id) + '</span>' +
         '<span class="titulo">' + esc(p.titulo.slice(0, 150)) + '</span>' +
         '<div class="meta">' + (p.quien ? esc(p.quien) + " · " : "") +
         esc(antiguedad(p.dias)) + '</div></li>';
  }
  return h + "</ul>";
}

function bloqueCuadrilla(pr) {
  var h = "<h3>La cuadrilla ahora</h3>";
  if (pr.ramas === null) {
    /* Sin poder leer el repositorio no se sabe quién trabaja. Decir «nadie»
       sería la mentira de la regla 3: se lee igual que «todo tranquilo». */
    return h + '<div class="chips">' + chipNoSe("quién trabaja") + '</div>';
  }
  if (!pr.cuadrilla.length) {
    h += '<div class="nada">ninguna rama con trabajo sin integrar, y ningún ' +
         'punto en curso: nadie trabajando</div>';
  } else {
    h += "<ul>";
    for (var i = 0; i < pr.cuadrilla.length; i++) {
      var a = pr.cuadrilla[i];
      h += '<li><span class="id">' + esc(a.quien) + '</span>' +
           '<span class="titulo">' + esc(a.que) + '</span>' +
           '<div class="chips"><span class="chip ' +
           (CLASE_RAMA[a.estado] || "nose") + '">' + esc(a.estado) +
           '</span></div>' +
           '<div class="meta">' + esc(a.rol || "sin rol") + ' · ' +
           esc(hace(a.hace_seg)) + '</div>' +
           '<div class="meta">' + esc(a.asunto) + '</div></li>';
    }
    h += "</ul>";
  }
  /* El reparto va SIEMPRE, con los ceros incluidos: «coder 3 · reviewer 0» es
     la frase que hace que alguien haga algo; «coder 3» no dice nada. */
  h += '<div class="chips">';
  for (var j = 0; j < pr.por_rol.reparto.length; j++) {
    var r = pr.por_rol.reparto[j];
    h += chip(r.rol, r.cuantos, r.cuantos ? "e-encurso" : "");
  }
  h += "</div>";
  if (!pr.por_rol.conocidos) {
    h += '<div class="chips">' + chipNoSe("qué roles existen") + '</div>' +
         '<div class="muy-tenue">Este repositorio no trae <code>ops/60-roles.md</code>, ' +
         'así que la lista de roles no se sabe. No se inventa la de otro proyecto.</div>';
  }
  return h;
}

function bloqueRamas(pr) {
  var h = "<h3>Ramas en GitHub</h3>";
  if (pr.ramas === null) {
    return h + '<div class="chips">' + chipNoSe("ramas") + '</div>' +
           '<div class="muy-tenue">No se pudo leer el repositorio, así que no ' +
           'hay ramas que mirar ni total que comparar.</div>';
  }
  if (!pr.ramas.length) return h + '<div class="nada">ninguna</div>';
  h += "<ul>";
  for (var i = 0; i < pr.ramas.length; i++) {
    var r = pr.ramas[i];
    var tot;
    if (r.total === null) {
      tot = chipNoSe("aserciones");
    } else if (r.delta === null) {
      tot = chip("aserciones", r.total, "");
    } else if (r.delta < 0) {
      /* Una rama que BAJA el total es sospechosa aunque esté verde: un arnés
         que dejó de encontrar lo que mira no se pone rojo, saltea en silencio
         y lo único que cambia es la cuenta. */
      tot = chip("aserciones (" + r.delta + " vs main)", r.total, "rojo");
    } else {
      tot = chip("aserciones (+" + r.delta + " vs main)", r.total, "verde");
    }
    h += '<li><span class="id">' + esc(r.nombre) + '</span>' +
         (r.punto ? '<span class="titulo">punto ' + esc(r.punto) + '</span>' : '') +
         '<div class="chips"><span class="chip ' +
         (CLASE_RAMA[r.estado] || "nose") + '">' + esc(r.estado) + '</span>' +
         tot + '</div>' +
         '<div class="meta">' + esc(hace(r.hace_seg)) + ' · ' + esc(r.autor) +
         ' · ' + esc(r.sha) +
         (r.commits_adelante === null ? '' :
          ' · ' + esc(r.commits_adelante) + ' adelante / ' +
          esc(r.commits_atras) + ' atrás de main') + '</div>' +
         '<div class="meta">' + esc(r.asunto) + '</div></li>';
  }
  return h + "</ul>";
}

function bloqueCommits(pr) {
  if (!pr.commits || !pr.commits.length) return "";
  var h = "<h3>Últimos commits</h3><ul>";
  for (var i = 0; i < pr.commits.length; i++) {
    var c = pr.commits[i];
    h += '<li><span class="id">' + esc(c.autor) + '</span>' +
         '<span class="titulo">' + esc(c.asunto) + '</span>' +
         '<div class="meta">' + esc(c.sha) + ' · ' +
         esc(hace(c.hace_seg === undefined ? null : c.hace_seg)) +
         '</div></li>';
  }
  return h + "</ul>";
}

function bloqueCI(pr) {
  var e = pr.ci.estado;
  var clase = e === "verde" ? "verde" : (e === "rojo" ? "rojo" : "nose");
  var h = '<h3>CI</h3><div class="chips"><span class="chip ' + clase + '">CI · ' +
          esc(e) + "</span></div>";
  if (pr.ci.motivo) {
    h += '<details><summary>por qué no se sabe</summary><p>' +
         esc(pr.ci.motivo) + "</p></details>";
  }
  return h;
}

function tarjeta(pr) {
  var h = '<div class="tarjeta"><h2>' + esc(pr.nombre) + "</h2>" +
          '<div class="muy-tenue">' +
          esc(pr.repo ? "github.com/" + pr.repo : "sin repositorio") + " · " +
          esc(pr.seguimiento.archivo) + "</div>";

  /* Un proyecto declarado sin repositorio NO es un error y no se pinta rojo:
     es un estado, y tiene su motivo escrito en `proyectos.json`. Pintarlo de
     rojo sería el aviso que sale siempre, que enseña a ignorar los avisos. */
  if (pr.nube.sin_repo) {
    return h + '<div class="chips"><span class="chip nose">sin publicar · ' +
           'no sé</span></div><div class="muy-tenue">' +
           esc(pr.nube.error) + "</div></div>";
  }

  if (!pr.seguimiento.existe) {
    return h + '<div class="chips"><span class="chip rojo">no pude leer el ' +
           'repositorio</span></div><div class="muy-tenue">' +
           esc(pr.seguimiento.error) + "</div></div>";
  }

  /* Un espejo que no se pudo refrescar sigue sirviendo, y dice que está viejo.
     Es la tercera cosa entre «al día» y «no sé», y las tres son distintas. */
  if (pr.nube.rancio) {
    h += '<div class="chips"><span class="chip ambar">datos de antes · el ' +
         'último refresco falló</span></div>' +
         '<div class="muy-tenue">' + esc(pr.nube.error) + '</div>';
  }

  h += "<h3>Puntos abiertos</h3><div class=\"chips\">";
  for (var i = 0; i < ESTADOS.length; i++) {
    h += chip(ESTADOS[i], pr.cuenta_abiertos[ESTADOS[i]], CLASE[ESTADOS[i]]);
  }
  if (pr.cuenta_abiertos["sin estado"]) {
    h += chip("sin estado", pr.cuenta_abiertos["sin estado"], CLASE["sin estado"]);
  }
  h += "</div>";
  h += '<div class="muy-tenue">y ' + esc(pr.cuenta_total["hecho"]) +
       " hechos en toda la historia del archivo</div>";

  h += "<h3>Te bloquean a vos · pendiente (Pablo)</h3>" +
       '<div class="chips">' +
       chip("puntos", pr.pendientes_de_pablo.length, "e-pablo") + "</div>" +
       listaPuntos(pr.pendientes_de_pablo, 7);

  h += "<h3>En curso</h3>" + listaPuntos(pr.en_curso, 3);

  h += bloqueCuadrilla(pr);
  h += bloqueRamas(pr);
  h += bloqueCommits(pr);
  h += bloqueCI(pr);

  var rep = pr.seguimiento.repetidos.filter(function (r) { return r.discrepa; });
  if (rep.length) {
    h += "<h3>El mismo punto, dos estados</h3><ul>";
    for (var k = 0; k < rep.length; k++) {
      h += '<li><span class="id">' + esc(rep[k].id) + "</span>" +
           '<span class="titulo">' + esc(rep[k].estado) + " en una fila, " +
           esc(rep[k].choca_con) + " en otra</span></li>";
    }
    h += "</ul>";
  }
  return h + "</div>";
}

/* Acá vivía una **segunda** `pintar(d)`, la del día cero: quince líneas que
   sólo dibujaban las tarjetas de proyecto. Quedó cuando se agregó la vista en
   vivo, y en JavaScript la última declaración gana, así que hacía años que no
   se ejecutaba — dos versiones de la misma función y ninguna regla sobre cuál
   gana, adentro del proyecto que tiene eso escrito como regla 1. Se borró el
   2026-08-15 al reordenar la pantalla; la que corre está más abajo. */

/* ---------------------------------------------------------------------------
   El demonio: tres relojes, y ninguno miente sobre lo que sabe el otro

     1 s   los contadores avanzan y el estado se vuelve a decidir. No sale a
           ningún lado: que el tiempo pasa se puede afirmar sin preguntar.
     2 s   se le pide `/api/estado` a capataz.
    15 s   capataz le pregunta a GitHub (`nube.REFRESCO`, y viaja en el JSON).

   El tercero es el único que hace que un agente aparezca antes, y por eso la
   frescura del dato se muestra siempre: un contador que corre cada segundo
   sobre una lectura de hace un minuto es el tablero que miente en el caso que
   importa.
--------------------------------------------------------------------------- */
var D = null;           /* el último estado que contestó el servidor */
var T_RECIBIDO = 0;     /* cuándo llegó, por el reloj de ESTA máquina */
var ULTIMO_OK = 0;
var VISTOS = null;      /* sha por agente en la lectura anterior */
var DESPIERTOS = {};    /* clave -> hasta cuándo mostrar que se despertó */
var FIRMA = "";
var FIRMA_TALLER = "";
var LATE = false;
var ESTATICA = false;
var SIN_CONTACTO = 10;  /* segundos sin respuesta para dejar de creerle a la pantalla */

var CLASE_AGENTE = {
  "trabajando": "a-trabajando", "dudoso": "a-dudoso", "caído": "a-caido",
  "sin rama": "a-sinrama", "no sé": "a-sinrama"
};

function claveAgente(a) { return a.proyecto + "·" + a.quien + "·" + a.que; }

/* Hace cuánto, contado SIN restar dos relojes distintos. El servidor manda
   `hace_seg` ya calculado con el suyo; acá se le suma lo que pasó desde que
   llegó, medido con el local. Restar el reloj del teléfono contra el de la Mac
   es cómo un contador arranca en «hace -3 min». */
function haceVivo(seg) {
  if (seg === null || seg === undefined) return null;
  return seg + (Date.now() - T_RECIBIDO) / 1000;
}

/* El estado se vuelve a decidir en la pantalla a cada segundo, con los umbrales
   que MANDA EL SERVIDOR. Copiarlos acá sería tener los mismos dos números en
   dos lugares y ninguna regla sobre cuál gana: la regla 1 de este proyecto.
   Sin umbrales en el JSON —una instantánea vieja— no se inventa ninguno: queda
   lo que dijo el servidor. */
function estadoVivo(seg, estadoServidor) {
  if (estadoServidor === "sin rama" || seg === null) return estadoServidor;
  if (!D || !D.umbrales) return estadoServidor;
  if (seg < D.umbrales.fresco) return "trabajando";
  if (seg < D.umbrales.tibio) return "dudoso";
  return "caído";
}

function filaAgente(a) {
  var seg = haceVivo(a.hace_seg);
  var e = estadoVivo(seg, a.estado);
  var k = claveAgente(a);
  var desperto = DESPIERTOS[k] && DESPIERTOS[k] > Date.now();
  return '<div class="agente ' + (CLASE_AGENTE[e] || "a-sinrama") +
    (desperto ? " desperto" : "") + '" data-hace="' +
    (a.hace_seg === null || a.hace_seg === undefined ? "" : a.hace_seg) +
    '" data-estado="' + esc(a.estado) + '">' +
    '<div class="quien">' + esc(a.quien) + '</div>' +
    '<div class="donde">' + esc(a.rol || "sin rol") + ' · ' +
    esc(a.proyecto) + ' · ' + esc(a.que) +
    (a.punto ? ' · punto ' + esc(a.punto) : '') + '</div>' +
    '<div class="chips"><span class="chip chip-estado ' +
    (CLASE_RAMA[e] || "nose") + '">' + esc(e) + '</span>' +
    '<span class="chip"><b class="reloj">' + esc(hace(seg)) + '</b>sin moverse</span>' +
    '</div>' +
    (desperto ? '<div class="recien">se despertó recién · ' + esc(a.sha) + '</div>' : '') +
    '<div class="meta">' + esc(a.asunto) + '</div></div>';
}

function pintarAgentes() {
  /* Sólo los que no tienen sesión acá. Los demás ya se dibujaron arriba, con lo
     suyo de GitHub adentro del mismo renglón: dibujarlos dos veces es el bug
     que esta tanda vino a arreglar. */
  var soloPublicados = ((D && D.agentes_todos) || [])
    .filter(function (f) { return f.fuente === "github"; })
    .map(function (f) { return f.github; });
  var cont = document.getElementById("agentes");
  var ag = soloPublicados.length || !(D && D.agentes_todos)
    ? soloPublicados : [];
  if (!(D && D.agentes_todos)) ag = (D && D.agentes) || [];
  if (!ag.length) {
    /* Cero acá **no** es «nadie trabajando»: quiere decir que todo lo publicado
       ya está asociado a un agente de esta máquina, arriba. Decir «nadie» sería
       mentir justo cuando el tablero está completo. */
    cont.innerHTML = '<div class="nada">ningún agente publicando desde otra ' +
      'máquina: todo lo que hay en GitHub ya está asociado a un agente de acá</div>';
    return;
  }
  cont.innerHTML = '<div class="tenue" style="margin:14px 0 4px">Sólo publicados ' +
    '— sin sesión en esta máquina</div>';
  var previo = cont.innerHTML;
  var h = "";
  for (var i = 0; i < ag.length; i++) h += filaAgente(ag[i]);
  cont.innerHTML = previo + h;
}

/* Cada segundo: los contadores y el estado, sin tocar el resto del DOM. Volver
   a dibujar todo cada segundo reiniciaría el latido del que se despertó, que es
   justo lo que hay que poder ver. */
function tickRelojes() {
  var filas = document.querySelectorAll("#agentes .agente");
  for (var i = 0; i < filas.length; i++) {
    var f = filas[i];
    var base = f.getAttribute("data-hace");
    var seg = base === "" ? null : haceVivo(parseFloat(base));
    var rel = f.querySelector(".reloj");
    if (rel) rel.textContent = hace(seg);
    var e = estadoVivo(seg, f.getAttribute("data-estado"));
    var chip = f.querySelector(".chip-estado");
    if (chip && chip.textContent !== e) {
      chip.textContent = e;
      chip.className = "chip chip-estado " + (CLASE_RAMA[e] || "nose");
      f.className = "agente " + (CLASE_AGENTE[e] || "a-sinrama");
    }
  }
  /* Y lo mismo para el taller. Hace falta acá y no en el repintado de cada dos
     segundos: la firma del taller ignora el reloj a propósito —si no, un
     subagente que escribe seguido repintaría la sección entera todo el
     tiempo—, así que sin esto el contador se congelaría en «hace 3 s» para
     siempre, que es la peor de las dos mentiras posibles. */
  var chips = document.querySelectorAll("#taller .chips[data-quieto]");
  for (var j = 0; j < chips.length; j++) {
    var c = chips[j];
    var b = c.getAttribute("data-quieto");
    var s = b === "" ? null : haceVivo(parseFloat(b));
    var r = c.querySelector(".reloj-taller");
    if (r) r.textContent = hace(s);
    var et = estadoTaller(s, c.getAttribute("data-estado"));
    var ct = c.querySelector(".chip-taller");
    if (ct && ct.textContent !== et) {
      ct.textContent = et;
      ct.className = "chip chip-taller " + (CLASE_TALLER[et] || "nose");
    }
  }
}

/* Hace cuánto se habló con GitHub, que no es hace cuánto repinta la pantalla ni
   hace cuánto capataz miró su espejo. Es `traido_en` —la marca que deja el
   `fetch`— y no `leido_en`: con esa otra la pantalla decía «GitHub leído hace
   1 s» para siempre, porque el espejo se lee en cada pedido.

   Se muestra el dato MÁS VIEJO de todos los proyectos: decir el más nuevo
   taparía al repositorio que dejó de refrescarse. */
function frescuraNube() {
  if (!D || !D.proyectos) return null;
  var peor = null;
  for (var i = 0; i < D.proyectos.length; i++) {
    var n = D.proyectos[i].nube || {};
    if (n.sin_repo) continue;   /* no tiene de dónde traerse: no es un atraso */
    if (!n.traido_en) return null;   /* uno sin marca y el conjunto es «no sé» */
    var v = D.ahora - n.traido_en;
    if (peor === null || v > peor) peor = v;
  }
  if (peor === null) return null;
  /* Puede dar negativo por unos segundos y no es un error: la hora del pedido
     se sella antes de salir a la red, y el `fetch` que tarda 1,2 s escribe su
     marca después. «Hace -2 s» no significa nada para el que mira; es recién. */
  return Math.max(0, peor) + (Date.now() - T_RECIBIDO) / 1000;
}

function pintarFrescura() {
  var el = document.getElementById("frescura");
  var pulso = document.getElementById("pulso");
  var mudo = (Date.now() - ULTIMO_OK) / 1000;

  if (ESTATICA) {
    pulso.className = "pulso apagado";
    el.textContent = "instantánea del " + (D ? D.cuando : "?") +
      " · esto no se actualiza solo: no hay servidor a quien preguntarle";
    return;
  }
  if (ULTIMO_OK && mudo > SIN_CONTACTO) {
    /* Se dejó de saber. Lo último que se supo se sigue mostrando —es lo último
       que se supo— pero apagado y con el motivo: una pantalla en vivo que se
       murió y sigue pintando lo viejo como si fuera de ahora es la regla 3
       rota en el único caso en que la pantalla importa. */
    document.body.classList.add("sin-contacto");
    pulso.className = "pulso muerto";
    el.textContent = "sin contacto con capataz hace " + Math.round(mudo) +
      " s · lo de abajo es de antes, no de ahora";
    return;
  }
  document.body.classList.remove("sin-contacto");
  LATE = !LATE;
  pulso.className = "pulso" + (LATE ? "" : " apagado");
  var f = frescuraNube();
  el.textContent = "GitHub leído " + (f === null ? "hace cuánto: no sé" : hace(f)) +
    " · se relee cada " + (D && D.refresco_nube ? D.refresco_nube : "?") +
    " s · pantalla al segundo";
}

/* Se despertó = cambió el sha, no el reloj. Un agente nuevo también cuenta,
   pero recién a partir de la SEGUNDA lectura: si no, la primera pintaría a
   todos como recién despiertos y el aviso no querría decir nada. */
function marcarDespiertos(ag) {
  var ahora = {};
  for (var i = 0; i < ag.length; i++) {
    var k = claveAgente(ag[i]);
    ahora[k] = ag[i].sha || "";
    if (VISTOS && VISTOS[k] !== ahora[k]) DESPIERTOS[k] = Date.now() + 60000;
  }
  VISTOS = ahora;
}

/* ---------------------------------------------------------------------------
   El taller: los agentes de ESTA máquina, en vivo.

   Es la otra fuente. GitHub contesta «qué quedó hecho» y sobrevive al reinicio;
   esto contesta «quién está prendido acá» y no ve más allá de la máquina. Por
   eso el alcance se pinta pegado al título y no en una nota al pie: una sección
   que muestra tres agentes locales como si fueran la flota es exactamente el
   tablero que miente del que habla la regla 3.
--------------------------------------------------------------------------- */
var CLASE_TALLER = {
  "trabajando": "r-trabajando", "dudoso": "r-dudoso",
  "sin señal": "r-sinsenal", "cerrado": "r-cerrado", "no sé": "nose"
};

/* Igual que el de las ramas: los umbrales los MANDA EL SERVIDOR y son otros
   —minutos, no horas—. Y los dos desenlaces que no dependen del reloj no se
   recalculan: `cerrado` es un hecho medido (el proceso no está) y `no sé` es la
   ausencia de transcripción. Pasarlos por el umbral los convertiría en una
   afirmación sobre el tiempo que nadie hizo. */
function estadoTaller(seg, estadoServidor) {
  if (estadoServidor === "cerrado" || estadoServidor === "no sé") return estadoServidor;
  if (seg === null || seg === undefined) return estadoServidor;
  if (!D || !D.umbrales_taller) return estadoServidor;
  if (seg < D.umbrales_taller.fresco) return "trabajando";
  if (seg < D.umbrales_taller.tibio) return "dudoso";
  return "sin señal";
}

function filaSubagente(a) {
  var seg = haceVivo(a.quieto_hace);
  var e = estadoTaller(seg, a.estado);
  var h = '<div class="subagente" data-estado="' + esc(a.estado) + '">' +
    '<div class="que">' + esc(a.descripcion || "(sin descripción)") + '</div>' +
    '<div class="chips" data-quieto="' +
    (a.quieto_hace === null || a.quieto_hace === undefined ? "" : a.quieto_hace) +
    '" data-estado="' + esc(a.estado) + '">' +
    '<span class="chip chip-taller ' + (CLASE_TALLER[e] || "nose") + '">' +
    esc(e) + '</span>' +
    '<span class="chip">' + esc(a.tipo) + '</span>' +
    (a.que ? '<span class="chip"><b>' + esc(a.que) + '</b>' +
      (a.sobre ? esc(a.sobre) : '') + '</span>' : '') +
    '<span class="chip"><b class="reloj-taller">' + esc(hace(seg)) +
    '</b>escribió</span>' +
    (a.modelo ? '<span class="chip">' + esc(a.modelo) + '</span>' : '') +
    (a.worktree ? '<span class="chip">worktree</span>' : '') +
    '</div>' +
    (a.motivo_estado ? '<div class="porque">' + esc(a.motivo_estado) + '</div>' : '');
  for (var i = 0; i < (a.hijos || []).length; i++) h += filaSubagente(a.hijos[i]);
  return h + '</div>';
}

function pintarTaller() {
  var cont = document.getElementById("taller");
  var t = (D && D.taller) || null;
  var c = (D && D.consola) || null;
  document.getElementById("alcance").textContent =
    t ? t.alcance : "esta máquina · ahora";
  if (!t) { cont.innerHTML = ""; return; }
  /* No se pudo mirar y cero sesiones son cosas distintas, y la diferencia es
     justo la que un tablero suele borrar. */
  if (!t.ok) {
    cont.innerHTML = '<div class="tarjeta"><h2>El taller no se pudo leer</h2>' +
      '<div class="tenue">' + esc(t.error) + '</div></div>';
    return;
  }
  var h = "";

  /* **Media vista que no se pudo leer se dice antes de dibujar la otra media.**
     Si el CLI no contesta, de los agentes background no se sabe nada — y sin
     este aviso la lista de abajo se leería como si fueran todos los que hay,
     que es la regla 3 rota justo donde el que mira no tiene cómo notarlo. */
  if (c && !c.ok) {
    h += '<div class="tarjeta"><h2>De los agentes background no sé</h2>' +
      '<div class="tenue">' + esc(c.error) + '</div>' +
      '<div class="porque">Lo de abajo sale de los archivos de la máquina y se ' +
      'lee igual.</div></div>';
  }

  /* El desacuerdo entre las dos fuentes, cuando lo hay. Unir no es tapar: si
     las dos hablan del mismo agente y no coinciden, se muestra. */
  for (var k = 0; k < ((c && c.desacuerdos) || []).length; k++) {
    var da = c.desacuerdos[k];
    h += '<div class="desacuerdo"><b>Las dos fuentes no dicen lo mismo: ' +
      esc(da.que) + '</b>' +
      '<div class="lado">consola · ' + esc(da.consola) + '</div>' +
      '<div class="lado">taller · ' + esc(da.taller) + '</div>' +
      '<div class="porque">sesión ' + esc(da.sesion) + '. Capataz no elige un ' +
      'ganador: para lo que comparten manda el archivo, y esto es algo que esa ' +
      'regla no explica.</div></div>';
  }

  /* Un renglón por agente, con lo de las dos fuentes ya asociado por
     `sessionId`. `agentes_maquina` lo arma el servidor: la pantalla no vuelve a
     decidir qué fuente gana — eso está escrito en un solo lugar. */
  /* De la lista única, las de esta máquina. Las que sólo están publicadas las
     dibuja `pintarAgentes()` abajo, en la misma vista y con la tarjeta que ya
     estaba probada. */
  var todos = (D && D.agentes_todos) || [];
  var filas = todos.filter(function (f) { return f.fuente !== "github"; });
  if (!todos.length) filas = t.agentes_maquina || t.sesiones || [];
  if (!filas.length) {
    cont.innerHTML = h + '<div class="nada">ningún agente de Claude Code en ' +
      'esta máquina. Los de otra máquina no se ven acá: eso lo contesta ' +
      'GitHub, en la otra pestaña</div>';
    return;
  }
  for (var i = 0; i < filas.length; i++) {
    var s = filas[i];
    /* El latido va **al lado del nombre**, no adentro del chip de estado: no es
       un estado, es «se está moviendo ahora». Y el umbral lo manda el servidor,
       como los otros dos. */
    var late = D && D.umbrales_taller && s.quieto_hace !== null &&
      s.quieto_hace !== undefined &&
      haceVivo(s.quieto_hace) < D.umbrales_taller.latiendo;
    h += '<div class="sesion"><div class="cab">' +
      (late ? '<span class="late" title="escribiendo ahora"></span>' : '') +
      '<b>' + esc(s.nombre || s.sesion) + '</b>' +
      /* Si vive lo dice el archivo; si no hay archivo, no se afirma. */
      (s.viva === null || s.viva === undefined
        ? '<span class="chip nose">no sé si vive</span>'
        : '<span class="chip ' + (s.viva ? "r-trabajando" : "r-cerrado") + '">' +
          (s.viva ? "prendida" : "el proceso no está") + '</span>') +
      /* El estado del CLI, que sólo tienen los background. */
      (s.estado_consola
        ? '<span class="chip ' + (CLASE_CONSOLA[s.estado_consola] || "nose") +
          '">' + esc(s.estado_consola) + '</span>' : '') +
      '<span class="chip' + (s.proyecto ? '' : ' nose') + '">' +
      esc(s.proyecto || "carpeta que capataz no vigila") + '</span></div>' +
      '<div class="tenue">' + esc(s.cwd) + '</div>' +
      (s.motivo_consola
        ? '<div class="porque">' + esc(s.motivo_consola) + '</div>' : '') +
      /* Qué está haciendo, que sale de la cola de su transcripción. Si no se
         sabe se dice el motivo y **no** se pone nada en su lugar: una sesión
         que está pensando y una cuya transcripción no aparece son cosas
         distintas. */
      (s.que
        ? '<div class="chips"><span class="chip"><b>' + esc(s.que) + '</b>' +
          (s.sobre ? esc(s.sobre) : '') + '</span>' +
          (s.quieto_hace === null || s.quieto_hace === undefined ? '' :
            '<span class="chip">' + esc(hace(s.quieto_hace)) +
            ' sin escribir</span>') + '</div>'
        : (s.motivo_que
            ? '<div class="porque">' + esc(s.motivo_que) + '</div>' : '')) +
      /* El asa para abrirlo. Capataz lo escribe y no lo corre. */
      (s.id ? '<div class="attach">claude attach ' + esc(s.id) + '</div>' : '') +
      /* Lo que este mismo agente publicó. Si no se lo pudo asociar se dice por
         qué —no empujó, no es un repo, hay dos en la misma rama— en vez de
         dejar el hueco: el hueco se lee como «no publicó nada». */
      (s.github
        ? '<div class="chips"><span class="chip ' +
          (CLASE_RAMA[estadoVivo(haceVivo(s.github.hace_seg), s.github.estado)] ||
           "nose") + '">' + esc(s.github.estado) + '</span>' +
          '<span class="chip"><b>' + esc(s.rama || s.github.que) + '</b>rama</span>' +
          (s.github.punto ? '<span class="chip"><b>' + esc(s.github.punto) +
            '</b>punto</span>' : '') +
          '<span class="chip">' + esc(hace(haceVivo(s.github.hace_seg))) +
          ' empujó</span></div>'
        /* El porqué de no tener GitHub se dice **sólo si tiene carpeta**: en un
           background muerto —que ya no tiene ni archivo— sumaría un tercer
           párrafo para decir algo obvio, y tres explicaciones apiladas en un
           teléfono tapan a los agentes de abajo. Se vio mirando. */
        : (s.motivo_sin_github && s.cwd && s.fuente !== "cli"
            ? '<div class="porque">' + esc(s.motivo_sin_github) + '</div>' : ''));
    if (!(s.agentes || []).length) {
      h += '<div class="porque">' + esc(s.motivo_sin_agentes ||
        "sin subagentes") + '</div>';
    }
    for (var j = 0; j < (s.agentes || []).length; j++) {
      h += filaSubagente(s.agentes[j]);
    }
    h += '</div>';
  }
  cont.innerHTML = h;
}

/* ---------------------------------------------------------------------------
   La consola: los agentes background, y el único dato que nadie más tiene.

   Las otras dos secciones salen de git y de archivos. Ésta sale de correr
   `claude agents --json --all`, y existe por una razón medida: el `state` de un
   background no está en ningún archivo, y el de uno que **ya terminó** no está
   en ninguna parte más —al pararse, su `<pid>.json` se borra—.

   El estado NO se recalcula acá, al revés que el de las ramas y el del taller.
   Aquéllos son un reloj —«hace cuánto que no se mueve»— y la pantalla los
   vuelve a decidir cada segundo para no quedarse con una foto vieja. Éste es un
   hecho que el CLI afirma, no un umbral: recalcularlo sería inventarlo.
--------------------------------------------------------------------------- */
var CLASE_CONSOLA = {
  "trabajando": "c-trabajando", "esperando": "c-esperando", "falló": "c-fallo",
  "terminado": "c-quieto", "parado": "c-quieto", "en cola": "c-quieto",
  "no sé": "nose"
};


/* ---------------------------------------------------------------------------
   El menú, y la marca que hace que una pestaña no esconda nada.

   Las cuatro vistas se declaran en UN lugar: el lateral y la tabbar se dibujan
   de acá, así que agregar una quinta no es tocar el marcado en tres lados.

   `problemasDe` es la mitad que justifica el cambio. Apiladas, las secciones se
   veían al pasar; detrás de un menú, un «no pude leer» que nadie abre es un
   error que no existe. Entonces la pestaña se marca **aunque esté escondida**.

   Y marca dos cosas nada más: **lo que no se pudo leer** y **lo que pide una
   persona**. Los estados normales no: medido el 2026-08-15, los cuatro agentes
   de este tablero están `caído` y los tres proyectos tienen filas «sin estado»,
   así que marcar por eso sería prender las cuatro pestañas en todas las
   corridas — el aviso que enseña a ignorarse, corolario de la regla 3.
--------------------------------------------------------------------------- */
/* Tres, y los nombres dicen **de dónde sale cada una**, que es la distinción
   que costó entender cuando eran cuatro: el taller es esta máquina ahora mismo,
   GitHub es lo que quedó publicado, y los proyectos contestan cómo va cada uno. */
var VISTAS = [
  { clave: "agentes",   rotulo: "Agentes",   icono: "◈" },
  { clave: "proyectos", rotulo: "Proyectos", icono: "▦" }
];
/* La consola primero, y es una decisión: es lo único de la pantalla que puede
   pedir que alguien haga algo ahora mismo.

   **Quién decide de verdad con cuál se abre es `arrancarVistas()`**, abajo;
   esto es el valor con el que se dibuja el menú antes de que ésa corra. Vale
   escribirlo porque poner un bug acá **no pone nada rojo** —lo pisa el arranque
   en el mismo tick— y eso se confundió una vez con una aserción vacua. */
var VISTA = VISTAS[0].clave;

function problemasDe(d, clave) {
  if (!d) return 0;
  if (clave === "agentes") {
    /* La pestaña de agentes cubre ahora las **tres** fuentes, porque la vista
       las unió. Marca si alguna no se pudo leer, si hay un agente trabado, y si
       hay un `sin rama` —un `en curso (fulano)` del que no llegó ni un commit—.
       No marcan los estados normales: un background `terminado` es un hecho, y
       `caído` es el estado más común de este tablero. */
    var n = 0;
    if (d.taller && !d.taller.ok) n += 1;
    if (d.consola && !d.consola.ok) n += 1;
    var filas = (d.agentes_todos && d.agentes_todos.length)
      ? d.agentes_todos
      : ((d.taller && d.taller.agentes_maquina) || []);
    for (var i = 0; i < filas.length; i++) {
      var f = filas[i];
      if (f.estado_consola === "esperando" || f.estado_consola === "falló") n += 1;
      if (f.github && f.github.estado === "sin rama") n += 1;
    }
    return n;
  }
  if (clave === "proyectos") {
    return (d.proyectos || []).filter(function (p) {
      var s = p.seguimiento || {};
      return s.existe === false || !!s.error;
    }).length;
  }
  return 0;
}

function irA(clave) {
  VISTA = clave;
  var vistas = document.querySelectorAll(".vista");
  for (var i = 0; i < vistas.length; i++) {
    var v = vistas[i];
    if (v.getAttribute("data-vista") === clave) v.removeAttribute("hidden");
    else v.setAttribute("hidden", "");
  }
  /* Cambiar de pestaña **no vuelve a pedir nada**: se dibuja de `D`, la misma
     foto que ya está. Un menú que dispara una lectura por toque es un menú que
     hace parpadear el tablero. */
  pintarNav();
  try { if (window.location) window.location.hash = clave; } catch (e) { }
}

function botonVista(v) {
  var n = problemasDe(D, v.clave);
  return '<button type="button" data-vista="' + v.clave + '"' +
    (v.clave === VISTA ? ' aria-current="page"' : '') +
    ' aria-label="' + esc(v.rotulo) + '">' +
    '<span class="icono" aria-hidden="true">' + v.icono + '</span>' +
    '<span class="rotulo">' + esc(v.rotulo) + '</span>' +
    (n ? '<span class="marca-vista" title="' + n + ' para mirar acá"></span>' : '') +
    '</button>';
}

function pintarNav() {
  var h = "";
  for (var j = 0; j < VISTAS.length; j++) h += botonVista(VISTAS[j]);
  var lugares = ["nav-principal", "tabbar"];
  for (var i = 0; i < lugares.length; i++) {
    var cont = document.getElementById(lugares[i]);
    if (!cont) continue;
    cont.innerHTML = h;
    /* El manejador se cuelga después de escribir el HTML, que es como dibuja
       todo el resto de este archivo. */
    var botones = cont.querySelectorAll("button");
    for (var k = 0; k < botones.length; k++) {
      botones[k].onclick = (function (clave) {
        return function () { irA(clave); };
      })(botones[k].getAttribute("data-vista"));
    }
  }
}

/* ---------------------------------------------------------------------------
   Apariencia: claro, oscuro, o lo que diga el aparato.

   El tema **no se guarda en el servidor**, y no es un detalle: capataz no
   guarda estado propio (regla 1). La preferencia es de quien mira, así que vive
   en su navegador. Si no hay `localStorage` —una instantánea abierta con
   `file://`, un navegador con todo apagado— no se rompe nada: se queda en
   automático, que es el que no necesita memoria.
--------------------------------------------------------------------------- */
var TEMAS = [
  { clave: "auto", rotulo: "Automático", ayuda: "lo que diga el aparato" },
  { clave: "claro", rotulo: "Claro" },
  { clave: "oscuro", rotulo: "Oscuro" }
];
var TEMA = "auto";

function leerTema() {
  try {
    var v = window.localStorage && window.localStorage.getItem("capataz-tema");
    for (var i = 0; i < TEMAS.length; i++) if (TEMAS[i].clave === v) return v;
  } catch (e) { /* sin localStorage se sigue igual */ }
  return "auto";
}

function temaEfectivo(clave) {
  if (clave !== "auto") return clave;
  /* Sin `matchMedia` se asume oscuro, que es el tema con el que nació esta
     pantalla: adivinar claro pintaría de blanco a quien no pidió nada. */
  try {
    if (window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: light)").matches) return "claro";
  } catch (e) { /* nada */ }
  return "oscuro";
}

function aplicarTema(clave) {
  TEMA = clave;
  var raiz = document.documentElement;
  if (raiz) {
    if (temaEfectivo(clave) === "claro") raiz.setAttribute("data-tema", "claro");
    else raiz.removeAttribute("data-tema");
  }
  try {
    if (window.localStorage) window.localStorage.setItem("capataz-tema", clave);
  } catch (e) { /* nada */ }
  pintarApariencia();
}

function pintarApariencia() {
  var m = document.getElementById("menu-apariencia");
  if (!m) return;
  var h = "";
  for (var i = 0; i < TEMAS.length; i++) {
    var t = TEMAS[i];
    h += '<button type="button" data-tema="' + t.clave + '"' +
      (t.clave === TEMA ? ' aria-current="true"' : '') + '>' + esc(t.rotulo) +
      '</button>' +
      (t.ayuda ? '<div class="ayuda">' + esc(t.ayuda) + '</div>' : '');
  }
  m.innerHTML = h;
  var botones = m.querySelectorAll("button");
  for (var k = 0; k < botones.length; k++) {
    botones[k].onclick = (function (clave) {
      return function () { aplicarTema(clave); m.setAttribute("hidden", ""); };
    })(botones[k].getAttribute("data-tema"));
  }
}

function arrancarApariencia() {
  aplicarTema(leerTema());
  var b = document.getElementById("btn-apariencia");
  var m = document.getElementById("menu-apariencia");
  if (b && m) {
    b.onclick = function () {
      if (m.hasAttribute("hidden")) m.removeAttribute("hidden");
      else m.setAttribute("hidden", "");
    };
  }
}

function pintar(d) {
  D = d;
  T_RECIBIDO = Date.now();
  document.getElementById("cabecera").textContent =
    d.cuando + " · " + d.proyectos.length + " proyecto" +
    (d.proyectos.length === 1 ? "" : "s") + " vigilado" +
    (d.proyectos.length === 1 ? "" : "s") + " en GitHub";

  marcarDespiertos(d.agentes || []);
  /* Sólo se vuelve a dibujar si algo cambió de verdad. Repintar cada dos
     segundos lo mismo apaga el latido del que se despertó y hace parpadear una
     pantalla que se mira fija. */
  var firma = JSON.stringify(d.agentes) + "|" + JSON.stringify(DESPIERTOS);
  if (firma !== FIRMA) { FIRMA = firma; pintarAgentes(); }

  /* Con la misma disciplina: se repinta sólo si cambió. Un subagente que
     escribe cada dos segundos cambiaría el mtime todo el tiempo, así que la
     firma ignora el reloj y mira quién está y en qué estado. */
  /* `que` y `sobre` van adentro de la firma, y eso costó un bug: sin ellos, una
     sesión que pasa de `Bash` a `Edit` **no se repinta nunca** —quién está y en
     qué estado no cambió—, así que la pantalla en vivo mostraba lo que el
     agente hacía hace media hora. Se vio mirando el navegador: forzar
     `pintarTaller()` a mano lo dibujaba bien. Sigue sin mirar el reloj: el
     `mtime` cambia cada dos segundos y eso haría parpadear la sección entera. */
  /* Una sola firma, porque ahora es una sola sección. Mira la lista **ya
     unida** —que es la que se dibuja—, más el estado de la consola y los
     desacuerdos, que también se pintan ahí. Sigue sin mirar el reloj: el
     `mtime` cambia cada dos segundos y eso haría parpadear la sección entera. */
  var firmaT = JSON.stringify(
    ((d.taller && (d.taller.agentes_maquina || d.taller.sesiones)) || []).map(
      function (s) {
        return [s.sesion, s.viva, s.proyecto, s.que, s.sobre, s.estado_consola,
          s.fuente, (s.agentes || []).map(function f(a) {
            return [a.id, a.estado, a.que, a.sobre, (a.hijos || []).map(f)];
          })];
      })) + "|" +
    ((d.taller && d.taller.ok) ? "ok" : (d.taller && d.taller.error)) + "|" +
    ((d.consola && d.consola.ok) ? "ok" : (d.consola && d.consola.error)) + "|" +
    JSON.stringify((d.consola && d.consola.desacuerdos) || []);
  if (firmaT !== FIRMA_TALLER) { FIRMA_TALLER = firmaT; pintarTaller(); }

  var h = "";
  if (d.sin_proyectos) {
    h = '<div class="tarjeta"><h2>Ningún proyecto vigilado</h2>' +
        '<div class="tenue">Agregá uno en <code>proyectos.json</code>: el ' +
        '<code>owner/repo</code> de GitHub y el nombre de su archivo de ' +
        'seguimiento, porque no todos se llaman igual.</div></div>';
  }
  for (var i = 0; i < d.proyectos.length; i++) h += tarjeta(d.proyectos[i]);
  document.getElementById("cuerpo").innerHTML = h;

  /* El menú se repinta con cada dato, porque las marcas salen del dato: una
     consola que se cayó recién tiene que prender su pestaña sin que nadie
     navegue hasta ahí. */
  pintarNav();
}

function traer() {
  fetch("/api/estado", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) { ULTIMO_OK = Date.now(); pintar(d); })
    .catch(function (e) {
      /* No se toca lo que ya está dibujado: de eso se encarga `pintarFrescura`,
         que es quien sabe hace cuánto que no se sabe nada. */
      document.getElementById("cabecera").textContent =
        "no llego al servidor: " + e;
    });
}

function tick() {
  tickRelojes();
  pintarFrescura();
}

/* La vista con la que se abre. Por defecto la consola —lo que se pidió—, y si
   la dirección trae un `#taller` se respeta: recargar en el teléfono no tiene
   por qué devolverte al principio. */
function arrancarVistas() {
  var pedida = "";
  try {
    pedida = ((window.location && window.location.hash) || "").replace("#", "");
  } catch (e) { pedida = ""; }
  var vale = false;
  for (var i = 0; i < VISTAS.length; i++) if (VISTAS[i].clave === pedida) vale = true;
  irA(vale ? pedida : VISTAS[0].clave);
}

/* La apariencia se aplica **antes** que cualquier dato: si esperara al primer
   fetch, quien eligió claro vería un destello oscuro en cada carga. */
arrancarApariencia();

if (window.CAPATAZ_DATOS) {
  /* Instantánea estática: los datos vienen incrustados y no hay a quién
     preguntarle. Es lo que se abre con `file://` para mirar el ancho angosto.
     Los contadores igual avanzan —el tiempo pasa— pero la pantalla dice que es
     una foto, porque nadie la está refrescando. */
  ESTATICA = true;
  pintar(window.CAPATAZ_DATOS);
  arrancarVistas();
  setInterval(tick, 1000);
  tick();
} else {
  arrancarVistas();
  traer();
  setInterval(traer, 2000);
  setInterval(tick, 1000);
}
</script>
</body>
</html>
